server:
  port: 4000

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ruiwuyuexin?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=true
    username: root
    password: 123456

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: # 如果没有密码可以留空
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # RabbitMQ配置
  rabbitmq:
    host: 192.168.81.128
    port: 5672  # RabbitMQ默认端口是5672，15672是管理界面端口
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 1
        max-concurrency: 5

mybatis:
  type-handlers-package: com.gag.RuiwuYuexin.handler
  configuration:
    map-underscore-to-camel-case: true

# MySQL Binlog配置
mysql:
  host: localhost
  port: 3306
  username: root
  password: 123456
  binlog:
    server-id: 123456
    # 可选，指定要监听的数据库
    database: ruiwuyuexin
    # 可选，指定要监听的表，格式：database.table
    tables:
      - ruiwuyuexin.goods
      - ruiwuyuexin.user
      # 添加更多需要监听的表


jwt:
  secret: MySuperSecretKey1234567890123456
  expiration: 3600000

logging:
  level:
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG
